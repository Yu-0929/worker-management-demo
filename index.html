<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工班管理系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .role-select {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .role-select h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .role-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .role-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .role-btn:active {
            transform: scale(0.95);
        }
        
        .master-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .master-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .master-btn:active {
            background: #667eea;
            color: white;
        }
        
        .content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .site-card, .task-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .site-card:active {
            transform: scale(0.98);
        }
        
        .site-card h3, .task-card h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .site-info, .task-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>🔧 工班管理系統</h1>
        </div>
        
        <!-- 角色選擇 -->
        <div id="roleSelect" class="role-select">
            <h2>請選擇身分</h2>
            <div class="role-buttons">
                <button class="role-btn" onclick="selectRole('master')">👷 師傅</button>
                <button class="role-btn" onclick="selectRole('manager')">👔 統籌</button>
            </div>
            
            <div id="masterSelect" class="hidden">
                <h2 style="margin-top: 20px; margin-bottom: 15px; color: #333; font-size: 18px;">選擇師傅</h2>
                <div class="master-buttons">
                    <button class="master-btn" onclick="selectMaster('何')">👷 何<br><small>壁紙</small></button>
                    <button class="master-btn" onclick="selectMaster('盧')">👷 盧<br><small>木工</small></button>
                    <button class="master-btn" onclick="selectMaster('大根')">👷 大根<br><small>隔間</small></button>
                    <button class="master-btn" onclick="selectMaster('書名')">👷 書名<br><small>水電</small></button>
                </div>
            </div>
        </div>
        
        <!-- 內容區 -->
        <div id="content" class="content hidden">
            <!-- 動態載入內容 -->
        </div>
    </div>

    <script>
        // API 網址
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFA8q4QRuOqE750jajJckqIgdVjvehLFLMrW9l9g6lo1FZiJoFdO7pEp2PRItnef1j/exec';
        
        let currentRole = '';
        let currentMaster = '';
        let allSites = [];
        let selectedSite = null;
        
        // JSONP 請求函數
        function jsonp(url, callback) {
            const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);
                callback(data);
            };
            
            const script = document.createElement('script');
            script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
            document.body.appendChild(script);
        }
        
        // 選擇角色
        function selectRole(role) {
            currentRole = role;
            
            if (role === 'master') {
                document.getElementById('masterSelect').classList.remove('hidden');
            } else {
                document.getElementById('roleSelect').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                loadManagerView();
            }
        }
        
        // 選擇師傅
        function selectMaster(masterName) {
            currentMaster = masterName;
            document.getElementById('roleSelect').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            loadMasterView();
        }
        
        // 載入師傅介面
        function loadMasterView() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>📋 ${currentMaster}的任務</h2>
                <p style="text-align: center; color: #666; padding: 30px;">
                    目前沒有任務<br><br>
                    <small>（如果有任務但沒顯示，請聯絡管理員）</small>
                </p>
                <button class="btn btn-secondary" onclick="backToRoleSelect()">返回</button>
            `;
        }
        
        // 載入統籌介面
        function loadManagerView() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>📊 統籌管理</h2>
                <button class="btn" onclick="showCreateSite()">🏗️ 建立案場</button>
                <button class="btn" onclick="showSiteList()">📋 查看案場列表</button>
                <button class="btn btn-secondary" onclick="backToRoleSelect()">返回</button>
            `;
        }
        
        // 顯示建立案場表單
        function showCreateSite() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>🏗️ 建立案場</h2>
                <div class="form-group">
                    <label>案場名稱 *</label>
                    <input type="text" id="siteName" placeholder="例如：台北店裝潢工程">
                </div>
                <div class="form-group">
                    <label>地點 *</label>
                    <input type="text" id="siteLocation" placeholder="例如：台北市中山區">
                </div>
                <div class="form-group">
                    <label>備註</label>
                    <textarea id="siteNote" placeholder="選填"></textarea>
                </div>
                <button class="btn" onclick="createSite()">建立案場</button>
                <button class="btn btn-secondary" onclick="loadManagerView()">返回</button>
            `;
        }
        
        // 建立案場
        async function createSite() {
            const name = document.getElementById('siteName').value.trim();
            const location = document.getElementById('siteLocation').value.trim();
            const note = document.getElementById('siteNote').value.trim();
            
            if (!name || !location) {
                alert('請填寫案場名稱和地點！');
                return;
            }
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'createSite',
                        siteData: {
                            name: name,
                            location: location,
                            note: note
                        }
                    })
                });
                
                alert('案場已建立！');
                loadManagerView();
                
            } catch (error) {
                alert('發生錯誤：' + error.message);
            }
        }
        
        // 顯示案場列表（使用 JSONP）
        function showSiteList() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>📋 案場列表</h2>
                <div class="loading">載入中...</div>
            `;
            
            // 使用 JSONP 取得案場列表
            jsonp(API_URL + '?action=getSites', function(result) {
                if (result.success && result.sites) {
                    allSites = result.sites;
                    renderSiteList(result.sites);
                } else {
                    content.innerHTML = `
                        <h2>📋 案場列表</h2>
                        <div class="error">載入失敗：${result.error || '未知錯誤'}</div>
                        <button class="btn btn-secondary" onclick="loadManagerView()">返回</button>
                    `;
                }
            });
        }
        
        // 渲染案場列表
        function renderSiteList(sites) {
            const content = document.getElementById('content');
            
            if (sites.length === 0) {
                content.innerHTML = `
                    <h2>📋 案場列表</h2>
                    <p style="text-align: center; color: #666; padding: 30px;">
                        目前沒有案場<br><br>
                        請先建立案場
                    </p>
                    <button class="btn" onclick="showCreateSite()">🏗️ 建立案場</button>
                    <button class="btn btn-secondary" onclick="loadManagerView()">返回</button>
                `;
                return;
            }
            
            let html = '<h2>📋 案場列表</h2>';
            
            sites.forEach(site => {
                html += `
                    <div class="site-card" onclick="showSiteTasks('${site.id}', '${site.name}')">
                        <h3>${site.name}</h3>
                        <div class="site-info">📍 ${site.location}</div>
                        <div class="site-info">🆔 ${site.id}</div>
                        <div class="site-info">📅 ${formatDate(site.createTime)}</div>
                    </div>
                `;
            });
            
            html += `
                <button class="btn" onclick="showCreateTaskWithSiteSelect()">➕ 新增任務</button>
                <button class="btn btn-secondary" onclick="loadManagerView()">返回</button>
            `;
            
            content.innerHTML = html;
        }
        
        // 顯示案場任務
        function showSiteTasks(siteId, siteName) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>📋 ${siteName} - 任務列表</h2>
                <div class="loading">載入中...</div>
            `;
            
            // 使用 JSONP 取得案場任務
            jsonp(API_URL + '?action=getSiteTasks&siteId=' + siteId, function(result) {
                if (result.success && result.tasks) {
                    renderSiteTasks(result.tasks, siteId, siteName);
                } else {
                    content.innerHTML = `
                        <h2>📋 ${siteName} - 任務列表</h2>
                        <div class="error">載入失敗：${result.error || '未知錯誤'}</div>
                        <button class="btn btn-secondary" onclick="showSiteList()">返回</button>
                    `;
                }
            });
        }
        
        // 渲染案場任務
        function renderSiteTasks(tasks, siteId, siteName) {
            const content = document.getElementById('content');
            
            let html = `<h2>📋 ${siteName} - 任務列表</h2>`;
            
            if (tasks.length === 0) {
                html += `
                    <p style="text-align: center; color: #666; padding: 30px;">
                        此案場目前沒有任務
                    </p>
                `;
            } else {
                tasks.forEach(task => {
                    const statusClass = task.status === '已完成' ? 'status-completed' : 'status-pending';
                    html += `
                        <div class="task-card">
                            <h3>${task.title}</h3>
                            <div class="task-info">📍 ${task.location}</div>
                            <div class="task-info">🔧 ${task.skill} | 👷 ${task.masterName}</div>
                            <div class="task-info">📝 ${task.description}</div>
                            <span class="task-status ${statusClass}">${task.status}</span>
                        </div>
                    `;
                });
            }
            
            html += `
                <button class="btn" onclick="showCreateTaskForSite('${siteId}', '${siteName}')">➕ 新增任務到此案場</button>
                <button class="btn btn-secondary" onclick="showSiteList()">返回案場列表</button>
            `;
            
            content.innerHTML = html;
        }
        
        // 新增任務到指定案場
        function showCreateTaskForSite(siteId, siteName) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>➕ 新增任務到 ${siteName}</h2>
                <div class="form-group">
                    <label>案場編號</label>
                    <input type="text" id="taskSiteId" value="${siteId}" readonly style="background: #f0f0f0;">
                </div>
                <div class="form-group">
                    <label>任務標題 *</label>
                    <input type="text" id="taskTitle" placeholder="例如：壁紙施工">
                </div>
                <div class="form-group">
                    <label>地點 *</label>
                    <input type="text" id="taskLocation" placeholder="例如：台北市中山區">
                </div>
                <div class="form-group">
                    <label>工種</label>
                    <select id="taskSkill">
                        <option value="壁紙">壁紙</option>
                        <option value="水電">水電</option>
                        <option value="木工">木工</option>
                        <option value="隔間">隔間</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>指派師傅</label>
                    <select id="taskMaster">
                        <option value="何">何</option>
                        <option value="盧">盧</option>
                        <option value="大根">大根</option>
                        <option value="書名">書名</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>任務說明 *</label>
                    <textarea id="taskDescription" placeholder="請輸入詳細說明..."></textarea>
                </div>
                <button class="btn" onclick="createTask()">新增任務</button>
                <button class="btn btn-secondary" onclick="showSiteTasks('${siteId}', '${siteName}')">返回</button>
            `;
        }
        
        // 從案場列表選擇案場新增任務
        function showCreateTaskWithSiteSelect() {
            const content = document.getElementById('content');
            
            let options = '';
            allSites.forEach(site => {
                options += `<option value="${site.id}">${site.name} (${site.id})</option>`;
            });
            
            content.innerHTML = `
                <h2>➕ 新增任務</h2>
                <div class="form-group">
                    <label>選擇案場 *</label>
                    <select id="taskSiteId">
                        ${options}
                    </select>
                </div>
                <div class="form-group">
                    <label>任務標題 *</label>
                    <input type="text" id="taskTitle" placeholder="例如：壁紙施工">
                </div>
                <div class="form-group">
                    <label>地點 *</label>
                    <input type="text" id="taskLocation" placeholder="例如：台北市中山區">
                </div>
                <div class="form-group">
                    <label>工種</label>
                    <select id="taskSkill">
                        <option value="壁紙">壁紙</option>
                        <option value="水電">水電</option>
                        <option value="木工">木工</option>
                        <option value="隔間">隔間</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>指派師傅</label>
                    <select id="taskMaster">
                        <option value="何">何</option>
                        <option value="盧">盧</option>
                        <option value="大根">大根</option>
                        <option value="書名">書名</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>任務說明 *</label>
                    <textarea id="taskDescription" placeholder="請輸入詳細說明..."></textarea>
                </div>
                <button class="btn" onclick="createTask()">新增任務</button>
                <button class="btn btn-secondary" onclick="showSiteList()">返回</button>
            `;
        }
        
        // 新增任務
        async function createTask() {
            const siteId = document.getElementById('taskSiteId').value.trim();
            const title = document.getElementById('taskTitle').value.trim();
            const location = document.getElementById('taskLocation').value.trim();
            const skill = document.getElementById('taskSkill').value;
            const masterName = document.getElementById('taskMaster').value;
            const description = document.getElementById('taskDescription').value.trim();
            
            if (!siteId || !title || !location || !description) {
                alert('請填寫所有必填欄位！');
                return;
            }
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'createTask',
                        taskData: {
                            siteId: siteId,
                            title: title,
                            location: location,
                            skill: skill,
                            masterName: masterName,
                            description: description
                        }
                    })
                });
                
                alert('任務已新增！');
                showSiteList();
                
            } catch (error) {
                alert('發生錯誤：' + error.message);
            }
        }
        
        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-TW');
        }
        
        // 返回角色選擇
        function backToRoleSelect() {
            document.getElementById('content').classList.add('hidden');
            document.getElementById('masterSelect').classList.add('hidden');
            document.getElementById('roleSelect').classList.remove('hidden');
            currentRole = '';
            currentMaster = '';
        }
    </script>
</body>
</html>
