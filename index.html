<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工班管理系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .role-select {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .role-select h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .role-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .role-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .role-btn:active {
            transform: scale(0.95);
        }
        
        .master-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .master-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .master-btn:active {
            background: #667eea;
            color: white;
        }
        
        .content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .task-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .task-card h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .task-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>🔧 工班管理系統</h1>
        </div>
        
        <!-- 角色選擇 -->
        <div id="roleSelect" class="role-select">
            <h2>請選擇身分</h2>
            <div class="role-buttons">
                <button class="role-btn" onclick="selectRole('master')">👷 師傅</button>
                <button class="role-btn" onclick="selectRole('manager')">👔 統籌</button>
            </div>
            
            <div id="masterSelect" class="hidden">
                <h2 style="margin-top: 20px; margin-bottom: 15px; color: #333; font-size: 18px;">選擇師傅</h2>
                <div class="master-buttons">
                    <button class="master-btn" onclick="selectMaster('何')">👷 何<br><small>壁紙</small></button>
                    <button class="master-btn" onclick="selectMaster('盧')">👷 盧<br><small>木工</small></button>
                    <button class="master-btn" onclick="selectMaster('大根')">👷 大根<br><small>隔間</small></button>
                    <button class="master-btn" onclick="selectMaster('書名')">👷 書名<br><small>水電</small></button>
                </div>
            </div>
        </div>
        
        <!-- 內容區 -->
        <div id="content" class="content hidden">
            <!-- 動態載入內容 -->
        </div>
    </div>

    <script>
        // API 網址
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFA8q4QRuOqE750jajJckqIgdVjvehLFLMrW9l9g6lo1FZiJoFdO7pEp2PRItnef1j/exec';
        
        let currentRole = '';
        let currentMaster = '';
        
        // 選擇角色
        function selectRole(role) {
            currentRole = role;
            
            if (role === 'master') {
                document.getElementById('masterSelect').classList.remove('hidden');
            } else {
                document.getElementById('roleSelect').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                loadManagerView();
            }
        }
        
        // 選擇師傅
        function selectMaster(masterName) {
            currentMaster = masterName;
            document.getElementById('roleSelect').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            loadMasterView();
        }
        
        // 載入師傅介面
        async function loadMasterView() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>📋 ${currentMaster}的任務</h2>
                <div class="loading">載入中...</div>
            `;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'getMasterTasks',
                        masterName: currentMaster
                    })
                });
                
                const result = await response.json();
                
                if (result.success && result.tasks.length > 0) {
                    let html = `<h2>📋 ${currentMaster}的任務</h2>`;
                    
                    result.tasks.forEach(task => {
                        const statusClass = task.status === '已完成' ? 'status-completed' : 'status-pending';
                        html += `
                            <div class="task-card">
                                <h3>${task.title}</h3>
                                <div class="task-info">📍 ${task.location}</div>
                                <div class="task-info">🔧 ${task.skill}</div>
                                <div class="task-info">📝 ${task.description}</div>
                                <span class="task-status ${statusClass}">${task.status}</span>
                                ${task.status === '待處理' ? `
                                    <button class="btn" onclick="showFeedbackForm('${task.id}')">提交回饋</button>
                                    <button class="btn" onclick="markComplete('${task.id}')">標記完成</button>
                                ` : ''}
                            </div>
                        `;
                    });
                    
                    html += `<button class="btn btn-secondary" onclick="backToRoleSelect()">返回</button>`;
                    content.innerHTML = html;
                } else {
                    content.innerHTML = `
                        <h2>📋 ${currentMaster}的任務</h2>
                        <p style="text-align: center; color: #666; padding: 30px;">目前沒有任務</p>
                        <button class="btn btn-secondary" onclick="backToRoleSelect()">返回</button>
                    `;
                }
            } catch (error) {
                content.innerHTML = `
                    <h2>錯誤</h2>
                    <p style="color: red;">載入失敗：${error.message}</p>
                    <button class="btn btn-secondary" onclick="backToRoleSelect()">返回</button>
                `;
            }
        }
        
        // 載入統籌介面
        function loadManagerView() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>📝 新增任務</h2>
                <div class="form-group">
                    <label>任務標題 *</label>
                    <input type="text" id="taskTitle" placeholder="例如：台北店水電維修">
                </div>
                <div class="form-group">
                    <label>地點 *</label>
                    <input type="text" id="taskLocation" placeholder="例如：台北市中山區">
                </div>
                <div class="form-group">
                    <label>工種</label>
                    <select id="taskSkill">
                        <option value="壁紙">壁紙</option>
                        <option value="水電">水電</option>
                        <option value="木工">木工</option>
                        <option value="隔間">隔間</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>指派師傅</label>
                    <select id="taskMaster">
                        <option value="何">何</option>
                        <option value="盧">盧</option>
                        <option value="大根">大根</option>
                        <option value="書名">書名</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>任務說明 *</label>
                    <textarea id="taskDescription" placeholder="請輸入詳細說明..."></textarea>
                </div>
                <button class="btn" onclick="createTask()">新增任務</button>
                <button class="btn btn-secondary" onclick="backToRoleSelect()">返回</button>
            `;
        }
        
        // 新增任務
        async function createTask() {
            const title = document.getElementById('taskTitle').value;
            const location = document.getElementById('taskLocation').value;
            const skill = document.getElementById('taskSkill').value;
            const masterName = document.getElementById('taskMaster').value;
            const description = document.getElementById('taskDescription').value;
            
            if (!title || !location || !description) {
                alert('請填寫所有必填欄位！');
                return;
            }
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'createTask',
                        taskData: {
                            title: title,
                            location: location,
                            skill: skill,
                            masterName: masterName,
                            description: description
                        }
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('任務新增成功！任務編號：' + result.taskId);
                    loadManagerView();
                } else {
                    alert('新增失敗：' + result.error);
                }
            } catch (error) {
                alert('發生錯誤：' + error.message);
            }
        }
        
        // 顯示回饋表單
        function showFeedbackForm(taskId) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>💬 提交回饋</h2>
                <div class="form-group">
                    <label>回饋內容 *</label>
                    <textarea id="feedbackText" placeholder="請輸入工作回饋..."></textarea>
                </div>
                <button class="btn" onclick="submitFeedback('${taskId}')">提交</button>
                <button class="btn btn-secondary" onclick="loadMasterView()">返回</button>
            `;
        }
        
        // 提交回饋
        async function submitFeedback(taskId) {
            const feedbackText = document.getElementById('feedbackText').value;
            
            if (!feedbackText) {
                alert('請輸入回饋內容！');
                return;
            }
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'submitFeedback',
                        taskId: taskId,
                        masterName: currentMaster,
                        feedbackText: feedbackText,
                        imageUrls: []
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('回饋提交成功！');
                    loadMasterView();
                } else {
                    alert('提交失敗：' + result.error);
                }
            } catch (error) {
                alert('發生錯誤：' + error.message);
            }
        }
        
        // 標記完成
        async function markComplete(taskId) {
            if (!confirm('確定要標記此任務為已完成嗎？')) {
                return;
            }
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'completeTask',
                        taskId: taskId,
                        masterName: currentMaster
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('任務已完成！');
                    loadMasterView();
                } else {
                    alert('操作失敗：' + result.error);
                }
            } catch (error) {
                alert('發生錯誤：' + error.message);
            }
        }
        
        // 返回角色選擇
        function backToRoleSelect() {
            document.getElementById('content').classList.add('hidden');
            document.getElementById('masterSelect').classList.add('hidden');
            document.getElementById('roleSelect').classList.remove('hidden');
            currentRole = '';
            currentMaster = '';
        }
    </script>
</body>
</html>
